<div class="form-container">

  <h2>Inserisci i dati del contatto</h2>

  <form>
<div class="modifica-contatto">
    <label>Nome</label>
    <input type="text" [(ngModel)]="nome" name="nome">

    <label>Cognome</label>
    <input type="text" [(ngModel)]="cognome" name="cognome">

    <label>Numero di telefono</label>
    <input type="text" [(ngModel)]="numTelefono" name="numTelefono">

    <label>Email</label>
    <input type="email" [(ngModel)]="email" name="email">

    <!-- Bottone Salva sotto a tutto -->
    <button class="btn-salva" >
      Salva
    </button>
</div>
  </form>

</div>
