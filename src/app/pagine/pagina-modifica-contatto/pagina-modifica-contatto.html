<div class="form-container">

  <h2>Cerca contatto da modificare</h2>

  <!-- FORM 1: CERCA PER ID -->
  <form>

    <label>ID del contatto</label>
    <input type="number" [(ngModel)]="idDaCercare" name="idDaCercare">

    <button class="btn-cerca" type="button" (click)="cercaContatto()">
      Cerca
    </button>

  </form>

 <h2>Modifica contatto</h2>

  <form>

    <label>Nome</label>
    <input type="string" [(ngModel)]="nome" name="nome">

    <label>Cognome</label>
    <input type="text" [(ngModel)]="cognome" name="cognome">

    <label>Numero di telefono</label>
    <input type="text" [(ngModel)]="numTelefono" name="numTelefono">

    <label>Email</label>
    <input type="text" [(ngModel)]="email" name="email">

    <button class="btn-cerca" type="button" (click)="salvaModifiche()">
      Salva modifiche
    </button>

  </form>






</div>
