<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Contatto</title>
  <link rel="stylesheet" href="contatto.css">
</head>
<body>

  <h1>Dettagli Contatto</h1>
  <button type="button"><a href="../"style="text-decoration: none;color: black;">Torna alla rubrica</a></button>
  
  
  <div class="contatto-dettagli">
    <p><strong>Nome:</strong> {{ c.nome }}</p>
    <p><strong>Cognome:</strong> {{ c.cognome }}</p>
    <p><strong>Telefono:</strong> {{ c.telefono }}</p>
    <p><strong>Email:</strong> {{ c.email }}</p>
  </div>

    <div>
      <label>Scegli un contatto dalla rubrica:</label>
      
      <select id="condivisione" name="condivisione">
        <option value="" disabled selected>-- Seleziona un familiare --</option>
    <span *ngFor="let item of listaContatti" > 
      <option *ngIf="checkContatto(item)" tags="option" [value]="item.id">
        {{ item.nome }} {{ item.cognome }}
      </option>
    </span>
      </select>
    </div>
    
    <button type="button" (click)="condividiContatto()">Aggiungi famigliare</button>
    <h3>Familiari Selezionati</h3>
    <div class="messaggio">
    {{ messaggio }}
    </div>

    <div *ngFor="let f of familiariSelezionati">


  <button (click)="vediDettaglio(f)">Info</button>
  <button (click)="rimuoviFamiliare(f)">Elimina</button>
</div>


</body>

</html>
