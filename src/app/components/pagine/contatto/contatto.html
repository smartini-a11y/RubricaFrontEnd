<h1>Dettagli Contatto</h1>
<button type="button" class="btn-ritorno">
  <a href="../" style="text-decoration: none; color: black;">Torna alla rubrica</a>
</button>
<app-btnmodifica [id]="c?.id"></app-btnmodifica>

<!-- DETTAGLIO CONTATTO -->
<div *ngIf="c as contatto" class="contatto-dettagli">
  <div class="campo">
    <label><strong>Nome:</strong> {{ contatto.nome }}</label>
  </div>
  <div class="campo">
    <label><strong>Cognome:</strong> {{ contatto.cognome }}</label>
  </div>
  <div class="campo">
    <label><strong>Telefono:</strong> {{ contatto.numTelefono }}</label>
  </div>
  <div class="campo">
    <label><strong>Email:</strong> {{ contatto.email }}</label>
  </div>
</div>
<hr>

<!-- SELECT PER AGGIUNGERE FAMILIARE -->
<div class="sezione-familiare">
  <label for="seleziona-familiare"><strong>Scegli un contatto da rendere un famigliare:</strong></label>
  <select id="seleziona-familiare" name="seleziona-familiare" [(ngModel)]="idContattoSelezionato">
    <option [ngValue]="null" disabled>-- Seleziona un familiare --</option>
    <option *ngFor="let item of contatti"
      [value]="item.id"
      [hidden]="item.id === c?.id || familiari.some(f => f.id === item.id)">
      {{ item.nome }} {{ item.cognome }}
    </option>
  </select>
  <button type="button" (click)="aggiungiFamigliare()">
    Rendi un familiare
  </button>
</div>
<hr>

<!-- LISTA FAMILIARI GIÀ ASSOCIATI -->
<div >
  <h3>Familiari</h3>
  <div *ngFor="let f of familiari" class="familiare-item">
    <span class="familiare-nome">
      {{ f.nome }} {{ f.cognome }}
    </span>
    <div class="familiare-actions">
      <a [routerLink]="['/contatto', f.id]" class="btn-info-custom">info</a>
      <button type="button" class="btn-elimina-custom" >
        Elimina
      </button>
    </div>
  </div>
</div>
<div *ngIf="familiari.length === 0">
  <p>Nessun familiare presente.</p>
</div>
