<h1>Dettagli Contatto</h1>

<button type="button" class="btn-ritorno">
  <a href="../" style="text-decoration: none; color: black;">Torna alla rubrica</a>
</button>

<app-btnmodifica></app-btnmodifica>

<!-- MOSTRA TUTTO SOLO QUANDO c È DEFINITO -->
<div *ngIf="c as contatto" class="contatto-dettagli">

   <div class="campo">
    <label><strong>Nome:</strong> {{ contatto.nome }}</label>
  </div>

  <div class="campo">
    <label><strong>Cognome:</strong> {{ contatto.cognome }}</label>
  </div>

  <div class="campo">
    <label><strong>Telefono:</strong> {{ contatto.numTelefono }}</label>
  </div>

  <div class="campo">
    <label><strong>Email:</strong> {{ contatto.email }}</label>
  </div>

</div>
