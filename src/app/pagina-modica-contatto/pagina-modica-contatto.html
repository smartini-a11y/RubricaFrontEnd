<div class="form-container">

  <h2>Modifica Contatto </h2>
 <form>
<div class="modifica-contatto">
    <label>Nome</label>
    <input type="text" [(ngModel)]="nome" name="nome">

    <label>Cognome</label>
    <input type="text" [(ngModel)]="cognome" name="cognome">

    <label>Numero di telefono</label>
    <input type="text" [(ngModel)]="numTelefono" name="numTelefono">

    <label>Email</label>
    <input type="text" [(ngModel)]="email" name="numTelefono">

</div>
    <button class="btn-modifica" >
      Salva
    </button>

  </form>


</div>
