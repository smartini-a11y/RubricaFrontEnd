<div class="form-container">

  <h2>dati del contatto da modificare </h2>


  //form iniziale che serve per mettere i dati del contatto da cercare
  <form>

    <label>Nome</label>
    <input type="text" [(ngModel)]="cercaNome" name="nome">

    <label>Cognome</label>
    <input type="text" [(ngModel)]="cercaCognome" name="cognome">

    <label>Numero di telefono</label>
    <input type="text" [(ngModel)]="cercaNumTelefono" name="numTelefono">

    <label>Email</label>
    <input type="text" [(ngModel)]="cercaEmail" name="numTelefono">


    <!-- Bottone Salva sotto a tutto -->
    <button class="btn-cerca" (click)="cercaContatto()">
      Cerca
    </button>

  </form>
</div>
//seconda form per modificare i dati del contatto

 <form>

</div>
